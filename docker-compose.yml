# Empaquetado (no es el loop local). Imagen alineada a Postgres 18.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: misupertostada
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d misupertostada"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
